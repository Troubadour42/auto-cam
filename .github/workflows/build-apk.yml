name: Build Auto Cam APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build version 1.0
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoCam-1.5.apk
      - name: Publish Auto Cam 1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: Auto Cam 1.5
          body: |
            Install AutoCam-1.5.apk.
            Playback has a pause button in the middle. The timer sits under the left-hand buttons. Voice works for start recording, save, and delete, and stays off while recording.
          files: AutoCam-1.5.apk
          fail_on_unmatched_files: true
